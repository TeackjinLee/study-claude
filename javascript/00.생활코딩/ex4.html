<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison operators & Boolean</title>
</head>
<body>
    <h1>Comparison operators & Boolean</h1>
    <h2>===</h2> <!-- === : Strict Equal Operator 값과 데이터 형식 같이 비교 -->
    <h2>==</h2> <!-- == : Equal Operator 값만 비교 -->
    <h3>1===1</h3>
    <script>
      document.write(1===1);
    </script>
    
    <h3>1===2</h3>
    <script>
      document.write(1===2);
    </script>

    <h3>1==="1"</h3>
    <script>
    document.write(1==="1");
    </script>

    <h3>1=="1"</h3>
    <script>
    document.write(1=="1");
    </script>
    
    <h3>1&lt;2</h3>
    <script>
      document.write(1<2);
    </script>
    
    <h3>1&lt;1</h3>
    <script>
      document.write(1<1);
    </script>
</body>
</html>
